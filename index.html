<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<title>Luiginho20 · Meus projetos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#eceff4;--card:#fff;--ink:#161a23;--mut:#586172;--line:#d6dbe4;--chip:#eef1f6}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12131a;--card:#1b1d27;--ink:#eef0f6;--mut:#9ba4b6;--line:#2a2e3b;--chip:#252937}}
body{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
main{max-width:1020px;margin:0 auto}
header{padding:40px 0 28px}
h1{font-size:clamp(2.4rem,9vw,4.2rem);font-weight:800;letter-spacing:-.03em;line-height:1}
header p{margin-top:12px;color:var(--mut);font-size:1.05rem;max-width:34ch}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr))}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--c);transform:translateY(-3px)}
.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.thumb{aspect-ratio:16/10;background:var(--chip)}
.thumb svg,.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb svg text{font-family:inherit}
.info{display:flex;flex-direction:column;gap:8px;padding:18px 18px 20px;flex:1}
h2{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.info p{color:var(--mut);font-size:.95rem;line-height:1.45}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tags span{font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--mut)}
.go{margin-top:auto;align-self:flex-start;padding:9px 20px;border-radius:99px;background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
footer{margin-top:36px;color:var(--mut);font-size:.85rem}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Luiginho20</h1>
    <p>Ferramentas e jogos que eu criei. Escolha um para abrir.</p>
  </header>
  <section class="grid" id="grid"></section>
  <footer>luiginho20.github.io</footer>
</main>

<script>
/* ============================================================
   COMO ADICIONAR UM NOVO SITE
   Copie um bloco { ... } da lista abaixo, cole no final e edite:
   - titulo, desc, url  (obrigatórios)
   - tags:   etiquetas pequenas do card
   - cor:    cor do botão e do destaque do card (use um tom escuro)
   - art:    ilustração pronta: 'calc', 'fuvest' ou 'jogo'
             (sem 'art', o card usa a inicial do título)
   - imagem: caminho de um print do site, ex.: 'img/meusite.png'
             (se existir, substitui a ilustração)
   ============================================================ */
const SITES = [
  {
    titulo: 'Calculadora',
    desc: 'Calculadora científica com histórico e funções f(x). Funciona bem no celular.',
    url: 'https://luiginho20.github.io/calculadora/',
    tags: ['Ferramenta', 'Matemática'],
    cor: '#c2571a',
    art: 'calc'
  },
  {
    titulo: 'Nota FUVEST 2027',
    desc: 'Simule sua nota final na escala de 1000 com as regras do Guia de Provas.',
    url: 'https://luiginho20.github.io/fuvest/',
    tags: ['Estudos', 'Simulador'],
    cor: '#1f55c4',
    art: 'fuvest'
  },
  {
    titulo: 'Speedanglo',
    desc: 'Jogo de contas rápidas com níveis, modo de 60 segundos e ranking global.',
    url: 'https://luiginho20.github.io/jogo/',
    tags: ['Jogo', 'Matemática'],
    cor: '#7a3ff2',
    art: 'jogo',
    imagem: 'img/speedanglo.jpg'
  },
  {
    titulo: 'Vídeo para PDF',
    desc: 'Transforma um vídeo em PDF, criando uma página cada vez que o slide muda. Tudo roda no seu aparelho.',
    url: 'https://luiginho20.github.io/videotopdf/',
    tags: ['Ferramenta', 'PDF'],
    cor: '#c23b3b',
    art: 'videopdf'
  }
];

/* ---------- Ilustrações (baseadas no visual de cada site) ---------- */
const SVG = (inner) => `<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;

const ART = {
  calc() {
    const L = ['7','8','9','÷','4','5','6','×','1','2','3','−'];
    let k = '';
    L.forEach((t, i) => {
      const x = 36 + (i % 4) * 64, y = 88 + Math.floor(i / 4) * 36, o = i % 4 === 3;
      k += `<rect x="${x}" y="${y}" width="56" height="28" rx="8" fill="${o ? '#e8833a' : '#3a3a37'}"/>` +
           `<text x="${x + 28}" y="${y + 19}" text-anchor="middle" font-size="15" font-weight="700" fill="${o ? '#fff' : '#ecebe6'}">${t}</text>`;
    });
    return SVG(`<rect width="320" height="200" fill="#262624"/>
      <rect x="36" y="14" width="248" height="62" rx="12" fill="#1a1a19"/>
      <text x="50" y="34" font-size="12" font-weight="700" fill="#e8833a">f(x)</text>
      <text x="50" y="66" font-size="11" font-weight="700" fill="#8d8b84">DEG</text>
      <text x="270" y="34" text-anchor="end" font-size="12" fill="#8d8b84">6 × 7</text>
      <text x="270" y="66" text-anchor="end" font-size="34" font-weight="800" fill="#f4f3ee">42</text>${k}`);
  },
  fuvest() {
    const rows = [['1ª fase', 144, '#ffd23f'], ['2ª fase · dia 1', 123, '#7fb2ff'], ['2ª fase · dia 2', 158, '#ffffff']];
    let b = '';
    rows.forEach(([n, w, c], i) => {
      const y = 122 + i * 24;
      b += `<text x="24" y="${y + 8}" font-size="11" fill="#dbe4fa">${n}</text>` +
           `<rect x="120" y="${y}" width="176" height="8" rx="4" fill="#254a94"/>` +
           `<rect x="120" y="${y}" width="${w}" height="8" rx="4" fill="${c}"/>`;
    });
    return SVG(`<rect width="320" height="200" fill="#14306b"/>
      <text x="296" y="36" text-anchor="end" font-size="13" font-weight="700" fill="#b8c7ea">FUVEST 2027</text>
      <text x="24" y="86" font-size="60" font-weight="800" fill="#ffd23f">812</text>
      <text x="24" y="104" font-size="11" fill="#b8c7ea">nota final · escala de 1000</text>${b}`);
  },
  jogo() {
    const o = [['27', 1], ['17', 0], ['29', 0]];
    let p = '';
    o.forEach(([t, s], i) => {
      const x = 40 + i * 80;
      p += s ? `<rect x="${x}" y="142" width="72" height="36" rx="18" fill="#5ef2ff"/>`
             : `<rect x="${x}" y="142" width="72" height="36" rx="18" fill="none" stroke="#8b6cff" stroke-width="2"/>`;
      p += `<text x="${x + 36}" y="166" text-anchor="middle" font-size="18" font-weight="800" fill="${s ? '#0d0820' : '#fff'}">${t}</text>`;
    });
    return SVG(`<defs><linearGradient id="gj" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26124f"/><stop offset="1" stop-color="#0d0820"/></linearGradient></defs>
      <rect width="320" height="200" fill="url(#gj)"/>
      <rect x="20" y="16" width="64" height="22" rx="11" fill="#fff" fill-opacity=".1"/>
      <text x="52" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">LVL 7</text>
      <rect x="226" y="16" width="74" height="22" rx="11" fill="#fff" fill-opacity=".1"/>
      <text x="263" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="#ffd23f">340 pts</text>
      <text x="160" y="92" text-anchor="middle" font-size="38" font-weight="800" fill="#5ef2ff">12 + 15 = <tspan fill="#ff4fa3">?</tspan></text>
      <rect x="40" y="108" width="240" height="6" rx="3" fill="#fff" fill-opacity=".14"/>
      <rect x="40" y="108" width="150" height="6" rx="3" fill="#ff4fa3"/>${p}`);
  },
  videopdf() {
    return SVG(`<rect width="320" height="200" fill="#2a1717"/>
      <rect x="24" y="52" width="136" height="92" rx="8" fill="#3d2424" stroke="#5a3636" stroke-width="2"/>
      <polygon points="80,84 80,112 104,98" fill="#fff" fill-opacity=".85"/>
      <rect x="118" y="58" width="36" height="18" rx="3" fill="none" stroke="#ff9f1c" stroke-width="2"/>
      <text x="136" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="#ff9f1c">12</text>
      <path d="M170 98h28m-8-8 8 8-8 8" fill="none" stroke="#f4dede" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="244" y="38" width="76" height="100" rx="6" fill="#d9c9c9"/>
      <rect x="232" y="46" width="76" height="100" rx="6" fill="#eadede"/>
      <rect x="220" y="54" width="76" height="104" rx="6" fill="#fff"/>
      <rect x="230" y="64" width="56" height="34" rx="4" fill="#c23b3b"/>
      <rect x="230" y="108" width="56" height="5" rx="2.5" fill="#ccc"/>
      <rect x="230" y="119" width="40" height="5" rx="2.5" fill="#ccc"/>
      <text x="230" y="146" font-size="12" font-weight="800" fill="#c23b3b">PDF</text>`);
  },
  mono(s) {
    const l = ((s.titulo || '?').trim()[0] || '?').toUpperCase();
    return SVG(`<rect width="320" height="200" fill="${s.cor || '#4a5bd4'}"/>
      <circle cx="270" cy="30" r="90" fill="#fff" fill-opacity=".1"/>
      <circle cx="40" cy="190" r="70" fill="#000" fill-opacity=".12"/>
      <text x="160" y="128" text-anchor="middle" font-size="96" font-weight="800" fill="#fff">${l}</text>`);
  }
};

/* ---------- Monta os cards ---------- */
const grid = document.getElementById('grid');
SITES.forEach((s) => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = s.url;
  a.style.setProperty('--c', s.cor || '#4a5bd4');
  a.innerHTML =
    `<div class="thumb"></div>
     <div class="info">
       <h2>${s.titulo}</h2>
       <p>${s.desc}</p>
       <div class="tags">${(s.tags || []).map((t) => `<span>${t}</span>`).join('')}</div>
       <span class="go">Abrir</span>
     </div>`;
  const th = a.querySelector('.thumb');
  th.innerHTML = (ART[s.art] || ART.mono)(s);
  if (s.imagem) {
    const img = new Image();
    img.alt = 'Prévia de ' + s.titulo;
    img.loading = 'lazy';
    img.onload = () => th.replaceChildren(img);
    img.src = s.imagem;
  }
  grid.appendChild(a);
});
</script>
</body>
</html>
